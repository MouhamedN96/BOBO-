<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOBO Live Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    
    .overlay-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
    }
    .overlay-container.visible { opacity: 1; transform: translateY(0); }
    
    .qr-wrapper {
      background: white;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    
    .qr-code { width: 180px; height: 180px; border-radius: 8px; }
    .product-info { margin-top: 12px; text-align: center; max-width: 200px; }
    .product-title { background: rgba(0,0,0,0.85); color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .product-price { background: linear-gradient(135deg, #FF6B35, #FF8F5E); color: white; padding: 10px 24px; border-radius: 25px; font-size: 20px; font-weight: 700; box-shadow: 0 4px 16px rgba(255,107,53,0.4); }
    .scan-prompt { margin-top: 8px; background: rgba(255,255,255,0.95); color: #1a1a2e; padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .loading, .error { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 14px; }
    .error { background: rgba(255,0,0,0.8); padding: 12px 24px; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <div id="loading" class="loading">Connexion...</div>
  <div id="error" class="error"></div>
  <div id="overlay" class="overlay-container">
    <div class="qr-wrapper"><img id="qr-code" class="qr-code" src="" alt="QR"></div>
    <div class="product-info">
      <div id="product-title" class="product-title"></div>
      <div id="product-price" class="product-price"></div>
    </div>
    <div class="scan-prompt">📱 Scannez pour acheter</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const urlParams = new URLSearchParams(window.location.search);
    const merchantId = urlParams.get('merchant') || window.location.pathname.split('/').filter(Boolean).pop();
    
    const $ = id => document.getElementById(id);
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    function updateOverlay(state) {
      $('loading').style.display = 'none';
      if (!state?.show_qr || !state?.qr_code_data_url) {
        $('overlay').classList.remove('visible');
        return;
      }
      $('qr-code').src = state.qr_code_data_url;
      $('product-title').textContent = state.product_title || '';
      $('product-title').style.display = state.product_title ? 'block' : 'none';
      $('product-price').textContent = state.product_price || '';
      $('product-price').style.display = state.product_price ? 'block' : 'none';
      $('overlay').classList.add('visible');
    }
    
    async function init() {
      if (!merchantId) { $('error').textContent = 'ID Marchand manquant'; $('error').style.display = 'block'; $('loading').style.display = 'none'; return; }
      
      const { data } = await supabase.from('livestream_overlay_state').select('*').eq('merchant_id', merchantId).single();
      updateOverlay(data);
      
      supabase.channel(`overlay-${merchantId}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'livestream_overlay_state', filter: `merchant_id=eq.${merchantId}` }, p => updateOverlay(p.new))
        .subscribe(s => { if (s === 'SUBSCRIBED') $('loading').style.display = 'none'; });
    }
    init();
  </script>
</body>
</html>
